{% extends "base_app.html" %}{% block title %}New Peripheral Preset{% endblock %}
{% block content %}<header class="page-header"><div><p class="eyebrow">Control boards</p><h1>New Peripheral Preset</h1></div></header>{% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}<section class="ops-panel"><form method="post" class="staff-user-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid"><div class="field-group"><label>Name</label><input name="name" maxlength="100" required></div><div class="field-group form-grid__wide"><label>Description</label><textarea name="description" maxlength="500"></textarea></div><div class="field-group checkbox-field"><label><input type="checkbox" name="enabled" value="true" checked> Enabled</label></div></div><div class="panel-actions"><button type="submit">Create preset</button><a class="button-secondary" href="/peripheral-presets">Cancel</a></div></form></section>{% endblock %}
