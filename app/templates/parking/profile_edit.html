{% extends "base_app.html" %}
{% block title %}Edit {{ profile.name }} &middot; ANPR Central{% endblock %}
{% block content %}<header class="page-header"><div><p class="eyebrow">Stay rules</p><h1>{{ profile.name }}</h1><p>Edit the profile without changing deadlines already snapshotted on open stays.</p></div><a class="button-secondary" href="/access-profiles">Back</a></header>
<section class="ops-panel"><form class="staff-user-form" method="post" action="/access-profiles/{{ profile.id }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid"><div class="field-group"><label>Site</label><select name="site_id" required>{% for site in sites %}<option value="{{ site.id }}" {% if site.id == profile.site_id %}selected{% endif %}>{{ site.code }} &middot; {{ site.name }}</option>{% endfor %}</select></div><div class="field-group"><label>Name</label><input name="name" maxlength="100" value="{{ profile.name }}" required></div><div class="field-group"><label>Description</label><input name="description" maxlength="500" value="{{ profile.description or '' }}"></div><div class="field-group"><label>Maximum stay (minutes)</label><input name="default_max_stay_minutes" type="number" min="1" value="{{ profile.default_max_stay_minutes or '' }}"></div></div><label class="account-state-option"><input type="checkbox" name="overstay_monitoring_enabled" value="true" {% if profile.overstay_monitoring_enabled %}checked{% endif %}><span><strong>Monitor overstays</strong></span></label><label class="account-state-option"><input type="checkbox" name="enabled" value="true" {% if profile.enabled %}checked{% endif %}><span><strong>Profile enabled</strong></span></label><div class="form-actions"><button class="button-primary button-primary--compact" type="submit">Save profile</button></div></form></section>{% endblock %}
