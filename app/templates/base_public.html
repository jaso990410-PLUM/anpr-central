<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b111b">
    <title>{% block title %}ANPR Central{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='/img/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
</head>
<body class="{% block body_class %}public-page{% endblock %}">
    <main class="{% block main_class %}public-shell{% endblock %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
